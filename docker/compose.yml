services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: regiment

    ports:
      - "5432:5432"

    volumes:
      - regiment_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d regiment"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  regiment_postgres_data:
